services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: atlas_ticketing
      MYSQL_USER: atlas
      MYSQL_PASSWORD: atlas
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - atlas-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - atlas-network

  notification-provider:
    build:
      context: ./notification-provider
    restart: unless-stopped
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/health') === false ? 1 : 0);"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - atlas-network

  api:
    build:
      context: ./api
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - ./docker/app.env
    environment:
      RUN_BOOTSTRAP: "true"
    expose:
      - "9000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) === false ? 1 : 0);"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - atlas-network

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./api/public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - atlas-network

  horizon:
    build:
      context: ./api
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - ./docker/app.env
    command: ["php", "artisan", "horizon"]
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - atlas-network

  scheduler:
    build:
      context: ./api
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - ./docker/app.env
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - atlas-network

volumes:
  mysql-data:
  redis-data:

networks:
  atlas-network:
    driver: bridge
